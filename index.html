function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
  return escapeHTML(value);
}

async function openAdminArea() {
  const session = await getValidAuthSession();
  if (!session) {
    pendingProtectedAction = "admin";
    openAuthModal("login");
    return;
  }
  if (!currentUserIsAdmin && !(await refreshAdminStatus())) {
    alert("Ce compte n’est pas autorisé à accéder à l’administration AutoChinaDZ.");
    return;
  }
  const section = document.getElementById("admin-space");
  const dashboard = document.getElementById("admin-dashboard");
  if (!section || !dashboard) return;
  section.hidden = false;
  dashboard.hidden = false;
  await loadAdminVehicles();
  section.scrollIntoView({ behavior: "smooth", block: "start" });
}

function closeAdminArea() {
  closeVehicleEditor();
  const section = document.getElementById("admin-space");
  if (section) section.hidden = true;
}

function setAdminMessage(message = "", type = "") {
  const target = document.getElementById("admin-message");
  if (!target) return;
  target.textContent = message;
  target.className = `admin-message${type ? ` ${type}` : ""}`;
}

async function loadAdminVehicles() {
  setAdminMessage("Chargement du catalogue…");
  try {
    adminVehicles = await authenticatedRest("vehicles?select=*&order=featured.desc,created_at.desc");
    const videos = await authenticatedRest("vehicle_videos?select=vehicle_id,video_url,title&order=created_at.desc");
    adminVideoByVehicle = new Map(videos.map(video => [String(video.vehicle_id), video]));
    updateAdminStats();
    renderAdminVehicles();
    setAdminMessage("");
  } catch (error) {
    console.error(error);
    setAdminMessage(error.message || "Impossible de charger l’administration.", "error");
  }
}

function updateAdminStats() {
  const total = document.getElementById("admin-total-count");
  const available = document.getElementById("admin-available-count");
  const featured = document.getElementById("admin-featured-count");
  if (total) total.textContent = adminVehicles.length;
  if (available) available.textContent = adminVehicles.filter(vehicle => vehicle.available === true).length;
  if (featured) featured.textContent = adminVehicles.filter(vehicle => vehicle.featured === true).length;
}

function renderAdminVehicles() {
  const target = document.getElementById("admin-vehicle-list");
  if (!target || document.getElementById("admin-space")?.hidden) return;
  const query = String(document.getElementById("admin-search")?.value || "").trim().toLowerCase();
  const filtered = adminVehicles.filter(vehicle => `${vehicle.brand_fr || ""} ${vehicle.model_fr || ""} ${vehicle.brand_ar || ""} ${vehicle.model_ar || ""}`.toLowerCase().includes(query));
  if (!filtered.length) {
    target.innerHTML = `<p>${query ? "Aucun véhicule correspondant." : "Le catalogue est vide."}</p>`;
    return;
  }
  target.innerHTML = filtered.map(vehicle => `
    <article class="admin-vehicle-row">
      <div class="admin-vehicle-name"><strong>${escapeHTML(`${vehicle.brand_fr || ""} ${vehicle.model_fr || ""}`.trim())}</strong><span>#${escapeHTML(vehicle.id)}${vehicle.year ? ` · ${escapeHTML(vehicle.year)}` : ""}${vehicle.featured ? " · ★ Vedette" : ""}</span></div>
      <span class="admin-row-meta">${escapeHTML(vehicle.price || "Sur demande")}</span>
      <span class="admin-row-badge">${escapeHTML(getConditionLabel(vehicle))}</span>
      <span class="admin-row-badge ${vehicle.available === true ? "available" : "unavailable"}">${escapeHTML(vehicle.available === true ? "Disponible" : "Indisponible")}</span>
      <div class="admin-row-actions"><button type="button" class="admin-secondary" onclick="openVehicleEditor(${vehicle.id})">Modifier</button><button type="button" class="admin-danger" onclick="deleteAdminVehicle(${vehicle.id})">Supprimer</button></div>
    </article>`).join("");
}

function openVehicleEditor(vehicleId = null) {
  const editor = document.getElementById("admin-editor");
  const form = document.getElementById("admin-vehicle-form");
  if (!editor || !form) return;
  form.reset();
  form.elements.available.checked = true;
  document.getElementById("admin-vehicle-id").value = vehicleId || "";
  document.getElementById("admin-editor-heading").textContent = vehicleId ? "Modifier la voiture" : "Ajouter une voiture";
  document.getElementById("admin-form-error").textContent = "";
  const vehicle = adminVehicles.find(item => String(item.id) === String(vehicleId));
  if (vehicle) {
    ["brand_fr","brand_ar","model_fr","model_ar","year","price","type","fuel_fr","fuel_ar","gearbox_fr","gearbox_ar","engine_fr","engine_ar","power","torque","seats","description_fr","description_ar","photo_folder","vehicle_status","location_fr","location_ar"].forEach(name => {
      if (form.elements[name]) form.elements[name].value = vehicle[name] ?? "";
    });
    form.elements.featured.checked = vehicle.featured === true;
    form.elements.available.checked = vehicle.available === true;
    form.elements.video_url.value = adminVideoByVehicle.get(String(vehicle.id))?.video_url || "";
  }
  editor.hidden = false;
  editor.scrollIntoView({ behavior: "smooth", block: "start" });
  setTimeout(() => form.elements.brand_fr?.focus(), 250);
}

function closeVehicleEditor() {
  const editor = document.getElementById("admin-editor");
  if (editor) editor.hidden = true;
}

function nullableNumber(value) { const text = String(value || "").trim(); return text ? Number(text) : null; }

async function uploadAdminMainPhoto(file, vehicleId) {
  if (!file) return null;
  if (!/^image\/(jpeg|png|webp|avif)$/i.test(file.type)) throw new Error("Format de photo non accepté.");
  if (file.size > 8 * 1024 * 1024) throw new Error("La photo dépasse 8 Mo.");
  const session = await getValidAuthSession();
  if (!session?.access_token) throw new Error("Connexion expirée.");
  const extension = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
  const path = `admin/${vehicleId}/main-${Date.now()}.${extension || "jpg"}`;
  const response = await fetch(`${SUPABASE_URL}/storage/v1/object/${VEHICLE_PHOTOS_BUCKET}/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + session.access_token, "Content-Type": file.type, "x-upsert": "false" },
    body: file
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(result.message || "Impossible d’envoyer la photo.");
  return storagePublicUrl(path);
}

async function saveAdminVehicle(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const data = new FormData(form);
  const errorBox = document.getElementById("admin-form-error");
  const saveButton = document.getElementById("admin-save-button");
  errorBox.textContent = "";
  saveButton.disabled = true;
  saveButton.textContent = "Enregistrement…";
  try {
    const payload = {
      p_id: nullableNumber(data.get("id")),
      p_brand_fr: data.get("brand_fr"), p_brand_ar: data.get("brand_ar"),
      p_model_fr: data.get("model_fr"), p_model_ar: data.get("model_ar"),
      p_year: nullableNumber(data.get("year")), p_price: data.get("price"), p_type: data.get("type"),
      p_fuel_fr: data.get("fuel_fr"), p_fuel_ar: data.get("fuel_ar"),
      p_gearbox_fr: data.get("gearbox_fr"), p_gearbox_ar: data.get("gearbox_ar"),
      p_engine_fr: data.get("engine_fr"), p_engine_ar: data.get("engine_ar"),
      p_power: data.get("power"), p_torque: data.get("torque"), p_seats: nullableNumber(data.get("seats")),
      p_description_fr: data.get("description_fr"), p_description_ar: data.get("description_ar"),
      p_featured: data.get("featured") === "on", p_available: data.get("available") === "on",
      p_photo_folder: data.get("photo_folder"), p_vehicle_status: data.get("vehicle_status"),
      p_location_fr: data.get("location_fr"), p_location_ar: data.get("location_ar")
    };
    const savedId = await authenticatedRest("rpc/admin_upsert_vehicle", { method: "POST", body: JSON.stringify(payload) });
    const vehicleId = Number(savedId);
    const photo = document.getElementById("admin-main-photo")?.files?.[0];
    if (photo) {
      const photoUrl = await uploadAdminMainPhoto(photo, vehicleId);
      await authenticatedRest("rpc/admin_set_vehicle_photo", { method: "POST", body: JSON.stringify({ p_vehicle_id: vehicleId, p_photo_url: photoUrl, p_category: "exterieur" }) });
    }
    await authenticatedRest("rpc/admin_set_vehicle_video", { method: "POST", body: JSON.stringify({ p_vehicle_id: vehicleId, p_video_url: data.get("video_url") || null, p_title: "Présentation du véhicule" }) });
    closeVehicleEditor();
    setAdminMessage("Véhicule enregistré avec succès.", "success");
    await loadVehicles();
    await loadAdminVehicles();
  } catch (error) {
    console.error(error);
    errorBox.textContent = error.message || "Impossible d’enregistrer le véhicule.";
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = "Enregistrer";
  }
}

async function deleteAdminVehicle(vehicleId) {
  const vehicle = adminVehicles.find(item => String(item.id) === String(vehicleId));
  const name = vehicle ? `${vehicle.brand_fr || ""} ${vehicle.model_fr || ""}`.trim() : `#${vehicleId}`;
  if (!confirm(`Supprimer définitivement ${name} du catalogue ?`)) return;
  try {
    setAdminMessage("Suppression en cours…");
    await authenticatedRest("rpc/admin_delete_vehicle", { method: "POST", body: JSON.stringify({ p_vehicle_id: vehicleId }) });
    setAdminMessage("Le véhicule a été supprimé du catalogue.", "success");
    await loadVehicles();
    await loadAdminVehicles();
  } catch (error) {
    console.error(error);
    setAdminMessage(error.message || "Impossible de supprimer le véhicule.", "error");
  }
}

function resetFilters() {
  ["search", "brand", "model", "year", "type", "fuel", "gearbox", "condition", "availability"]
    .forEach(id => {
      const element = document.getElementById(id);
      if (element) element.value = "";
    });
  setPriceMode("price");
  updateModels();
  syncBrandTiles();
  displayVehicles();
}

function applyCondition(label) {
  const select = document.getElementById("condition");
  if (!select) return;

  const normalized = label.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  select.value = normalized.includes("occasion") ? "occasion" : normalized.includes("import") || normalized.includes("-3") ? "importe_moins_3_ans" : "neuf";
  displayVehicles();
}

["model", "year", "type", "fuel", "gearbox", "condition", "availability"].forEach(id => {
